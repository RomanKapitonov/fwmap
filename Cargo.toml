[package]
name = "fwmap"
version = "0.1.0"
edition = "2024"
description = "Firmware memory reporting and budget validation for embedded Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RomanKapitonov/fwmap"
publish = false

[dependencies]
camino = "1.2.1"
clap = { version = "4.5.38", features = ["derive"] }
cargo_metadata = "0.23.1"
object = { version = "0.37.3", default-features = false, features = ["read"] }
regex = "1.12.2"
rustc-demangle = "0.1.26"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.8"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3"

[workspace]
